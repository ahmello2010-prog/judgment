<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحكمة</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=Harmattan:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold-glow:rgb(213,167,92);
  --deep-navy:rgb(13,25,43);
  --inner-vintage:rgb(66,52,35);
  --shadow-black:rgb(5,10,18);
  --text-white:rgb(255,255,255);
  --gold-dim:rgba(213,167,92,.35);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--shadow-black);color:var(--text-white);font-family:'Harmattan','Alexandria',sans-serif;font-size:1.1rem;overflow:hidden;direction:rtl}
button{font-family:'Alexandria',sans-serif}
:focus-visible{outline:2px solid var(--gold-glow);outline-offset:2px}

/* ===== شاشة التحميل (الإطار المعتمد) ===== */
.modern-loading-overlay{position:fixed;inset:0;z-index:100000;align-items:center;justify-content:center}
.loading-blurred-backdrop{position:absolute;inset:0;background:rgba(5,10,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.loading-card-content{position:relative;width:min(88vw,380px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.gavel-glow-animation{width:190px;height:190px;filter:drop-shadow(0 0 26px rgba(213,167,92,.4))}
.gavel-emoji{display:block;width:100%;height:100%}
.loading-main-title{margin:0;font-family:'Alexandria',sans-serif;font-weight:800;font-size:2.8rem;color:var(--gold-glow)}
.loading-subtitle-hint{margin:0;min-height:1.6em;color:var(--text-white);opacity:.75;transition:opacity .15s}
.modern-progress-wrapper{width:100%;height:6px;margin-top:14px;border-radius:6px;background:var(--inner-vintage);overflow:hidden}
.modern-progress-fill{height:100%;width:0;background:var(--gold-glow)}
.modern-percentage-text{margin-top:6px;font-family:'Alexandria',sans-serif;color:var(--gold-glow);font-variant-numeric:tabular-nums}

/* ===== أرضية القاعة: حلقات نحاسية تحت المقاعد ===== */
#court-arena{position:fixed;inset:0;background:radial-gradient(90% 70% at 50% 0%,var(--deep-navy),var(--shadow-black))}
.floor{position:fixed;left:50%;top:50%;width:min(96vmin,760px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0 46px,rgba(213,167,92,.10) 46px 47px),radial-gradient(circle,var(--inner-vintage) 0,transparent 42%);opacity:.9}
#seats-container{position:fixed;inset:0;z-index:2}

/* ===== الشريط العلوي ===== */
.topbar{position:fixed;top:calc(var(--safe-t) + 10px);left:12px;right:12px;z-index:30;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:auto}
#btn-hamburger{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-glow);background:var(--deep-navy);color:var(--gold-glow);font-size:1.25rem;cursor:pointer}
.room-tag{font-family:'Alexandria',sans-serif;font-size:.8rem;color:var(--gold-glow);opacity:.85}
.room-tag b{color:var(--text-white);letter-spacing:.14em}
.score-chip{display:flex;align-items:baseline;gap:6px;padding:5px 14px;border-radius:8px;background:var(--inner-vintage);border:1px solid var(--gold-dim)}
.score-chip small{opacity:.7}
#personal-current-score-text{font-family:'Alexandria',sans-serif;font-weight:800;color:var(--gold-glow)}

/* ===== لوحة الدور والصينية (الأزرار في مكان واحد) ===== */
#role-plate{position:fixed;z-index:20;display:none}
#role-plate strong{display:block;font-family:'Alexandria',sans-serif;font-weight:800;color:var(--gold-glow);line-height:1.4}
#role-plate span{opacity:.75;font-size:1rem}
#role-tray{position:fixed;z-index:40;display:none}
#role-tray.has-items{display:flex}
#role-tray>*{position:static!important;inset:auto!important;margin:0!important;transform:none!important;width:auto!important;pointer-events:auto}
#judge-control-panel{display:none;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.judge-counter-display{opacity:.85;font-size:1rem}
.judge-counter-display strong{color:var(--gold-glow);font-family:'Alexandria',sans-serif}
#interrogation-penalty-warning{flex-basis:100%;text-align:center}

/* ===== شكل الأزرار الموحد (يُطبَّق من الجافاسكريبت بعد إزالة ستايلاتها القديمة) ===== */
.ct-btn{min-height:44px;padding:10px 16px;border-radius:6px;border:1px solid var(--gold-glow);background:var(--deep-navy);color:var(--text-white);
  font-family:'Alexandria',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--inner-vintage);transition:background .15s,color .15s}
.ct-btn:hover{background:var(--inner-vintage)}
.ct-btn:active{translate:0 1px}
.ct-btn.btn-verdict-style{background:var(--gold-glow);color:var(--shadow-black);font-weight:800;box-shadow:inset 0 -3px 0 rgba(5,10,18,.25)}

/* ===== القاضي: منصة خشبية معلّقة من الأعلى ===== */
body[data-role="judge"] #role-tray{top:calc(var(--safe-t) + 64px);left:0;right:0;justify-content:center;padding:12px 14px 16px;
  background:linear-gradient(var(--inner-vintage),var(--deep-navy));border-bottom:3px solid var(--gold-glow);border-radius:0 0 50% 50%/0 0 26px 26px}
body[data-role="judge"] #role-plate{bottom:calc(var(--safe-b) + 14px);left:50%;translate:-50% 0;text-align:center;padding:8px 26px;background:var(--gold-glow);border-radius:4px}
body[data-role="judge"] #role-plate strong{color:var(--shadow-black);font-size:1.15rem}
body[data-role="judge"] #role-plate span{color:var(--shadow-black);opacity:.8}

/* ===== محامي الادعاء: ملف قضية يصعد من الأسفل بلسان جانبي ===== */
body[data-role="prosecutor"] #role-tray{bottom:0;left:0;right:0;padding:16px 14px calc(var(--safe-b) + 16px);gap:8px;flex-wrap:wrap;justify-content:center;
  background:var(--inner-vintage);border-top:3px solid var(--gold-glow);border-radius:22px 22px 0 0}
body[data-role="prosecutor"] #role-plate{right:16px;bottom:calc(var(--safe-b) + 128px);padding:6px 18px;background:var(--inner-vintage);border:1px solid var(--gold-glow);border-bottom:none;border-radius:14px 14px 0 0}
body[data-role="prosecutor"] #role-plate strong{font-size:1rem}
body[data-role="prosecutor"] #role-plate span{display:none}

/* ===== محامي الدفاع: سكة عمودية عند الحافة واسم مكتوب طولياً ===== */
body[data-role="defense"] #role-tray{left:10px;bottom:calc(var(--safe-b) + 18px);flex-direction:column;gap:8px;padding:12px 10px;background:var(--deep-navy);border:1px solid var(--gold-glow);border-radius:0 30px 30px 0;left:0}
body[data-role="defense"] #role-plate{left:12px;top:calc(var(--safe-t) + 70px);writing-mode:vertical-rl;padding:14px 6px;background:var(--gold-glow);border-radius:20px}
body[data-role="defense"] #role-plate strong{color:var(--shadow-black);font-size:1rem}
body[data-role="defense"] #role-plate span{display:none}

/* ===== المتهم: إضاءة كاشفة من الأعلى ولوحة أرقام ===== */
body[data-role="suspect"] #court-arena::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;
  background:radial-gradient(60% 55% at 50% 42%,transparent 0,rgba(5,10,18,.78) 100%),conic-gradient(from 165deg at 50% -5%,transparent 0 0deg,rgba(213,167,92,.12) 15deg,transparent 30deg)}
body[data-role="suspect"] #role-plate{top:calc(var(--safe-t) + 66px);left:50%;translate:-50% 0;text-align:center;padding:8px 22px;border:2px solid var(--gold-glow);
  background:repeating-linear-gradient(90deg,var(--deep-navy) 0 22px,var(--shadow-black) 22px 23px)}
body[data-role="suspect"] #role-plate strong{font-size:1.05rem}
body[data-role="suspect"] #role-tray{bottom:calc(var(--safe-b) + 16px);left:50%;translate:-50% 0!important;z-index:50}
body[data-role="suspect"] #role-tray .ct-btn{border-radius:999px}

/* ===== بقية اللاعبين: بطاقة صغيرة وزر عائم ===== */
body[data-role="citizen"] #role-plate{top:calc(var(--safe-t) + 66px);right:12px;padding:6px 14px;background:var(--deep-navy);border:1px dashed var(--gold-dim);border-radius:8px}
body[data-role="citizen"] #role-plate strong{font-size:.95rem}
body[data-role="citizen"] #role-plate span{display:none}
body[data-role="citizen"] #role-tray{bottom:calc(var(--safe-b) + 18px);left:16px;flex-direction:column;gap:8px}
body[data-role="citizen"] #role-tray .ct-btn{border-radius:999px}

/* ===== القائمة الجانبية ===== */
#sidebar-drawer{position:fixed;top:0;bottom:0;right:0;width:min(80vw,290px);z-index:60;padding:calc(var(--safe-t) + 72px) 18px 24px;background:var(--deep-navy);border-left:2px solid var(--gold-glow);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;gap:10px}
#sidebar-drawer.sidebar-drawer-active{transform:none}
#sidebar-drawer h2{margin:0 0 6px;font-family:'Alexandria',sans-serif;font-weight:800;font-size:1.3rem;color:var(--gold-glow)}
#btn-end-trial{display:none}

/* ===== النوافذ ===== */
.modal-shell{position:fixed;inset:0;z-index:200000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,18,.78)}
.modal-shell.modal-overlay-active,.modal-shell.host-overlay-active{display:flex}
.modal-box{width:min(92vw,400px);padding:22px;border-radius:10px;background:var(--deep-navy);border:1px solid var(--gold-glow);text-align:center}
.modal-box h2{margin:0 0 8px;font-family:'Alexandria',sans-serif;font-weight:800;font-size:1.25rem;color:var(--gold-glow)}
.modal-box p{margin:0 0 18px;line-height:1.7}
.modal-actions{display:flex;gap:10px}
.modal-actions .ct-btn{flex:1}

@media (max-width:520px){.room-tag{display:none}}
@media (prefers-reduced-motion:reduce){#sidebar-drawer,.ct-btn{transition:none}}
</style>
</head>
<body data-role="citizen">

<!-- شاشة التحميل السينمائية لساحة اللعب (مخفية افتراضياً وتظهر عند بدء القضية) -->
<div id="lobby-loading-screen" class="modern-loading-overlay" style="display: none">
<div class="loading-blurred-backdrop"></div>

<div class="loading-card-content">
<!-- أنيميشن الميزان النابض -->
<!-- الهيكل المطور الخالي تماماً من الإطار الأبيض -->
<div class="gavel-glow-animation">
<span class="gavel-emoji">
<iframe
src="https://lottie.host/embed/5c8b4548-c18c-407f-9e64-00014c2aa006/UAYSrmYfhz.lottie"
style="border: none; background: transparent; width: 100%; height: 100%"
allowfullscreen>
</iframe>
</span>
</div>

<h1 class="loading-main-title">المحكمة</h1>
<p id="loading-dynamic-hint" class="loading-subtitle-hint">جاري سحب الأجهزة وتوزيع الأدوار السرية...</p>

<!-- شريط العداد الذهبي -->
<div class="modern-progress-wrapper">
<div id="progress-bar-fill" class="modern-progress-fill"></div>
</div>

<div id="progress-counter-text" class="modern-percentage-text">0%</div>
</div>
</div>

<header class="topbar">
  <button id="btn-hamburger" aria-label="القائمة">☰</button>
  <div class="room-tag">الغرفة <b id="room-code-number">----</b></div>
  <div class="score-chip"><small>رصيدك</small><span id="personal-current-score-text">0</span></div>
</header>

<main id="court-arena" style="display:none">
  <div class="floor" aria-hidden="true"></div>
  <div id="seats-container"></div>
  <div id="role-plate"><strong id="role-plate-name"></strong><span id="role-plate-hint"></span></div>
  <div id="role-tray"><div id="judge-control-panel"></div></div>
</main>

<aside id="sidebar-drawer" aria-label="القائمة">
  <h2>قائمة الجلسة</h2>
  <button id="btn-open-shop" class="ct-btn">متجر المشتريات</button>
  <button id="btn-end-trial" class="ct-btn">إنهاء المحاكمة</button>
</aside>

<div id="custom-alert-modal" class="modal-shell">
  <div class="modal-box">
    <h2 id="modal-alert-title"></h2>
    <p id="modal-alert-message"></p>
    <div class="modal-actions"><button id="btn-modal-close" class="ct-btn">حسناً</button></div>
  </div>
</div>

<div id="host-exit-modal" class="modal-shell">
  <div class="modal-box">
    <h2>مغادرة الجلسة</h2>
    <p>إذا غادرت بصفتك منشئ الغرفة فستُغلق الجلسة لجميع اللاعبين.</p>
    <div class="modal-actions">
      <button id="btn-host-cancel-exit" class="ct-btn">البقاء</button>
      <button id="btn-host-confirm-exit" class="ct-btn btn-verdict-style">إغلاق الجلسة</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
(function(){
  var TEXT={judge:["تدير الجلسة وتصدر الحكم","القاضي"],prosecutor:["تثبت التهمة","محامي الادعاء"],defense:["تدافع عن المتهم","محامي الدفاع"],suspect:["حافظ على هدوئك","المتهم"],citizen:["اجمع الخيوط","لاعب"]};
  var IDS=["btn-evidence-bag-trigger","objection-card-trigger","btn-unified-questions-trigger-holder","btn-lawyer-radar-trigger-holder","request-speak-trigger"];
  var last="", queued=false;

  function roleOf(c){
    var n=c.role_name||"";
    if(c.role_type==="judge")return"judge";
    if(c.role_type==="lawyer")return n.indexOf("دفاع")>-1?"defense":"prosecutor";
    return n.indexOf("متهم")>-1?"suspect":"citizen";
  }
  function paint(){
    var c=window.myCurrentRoleCard;
    if(!c||(!c.role_name&&!c.role_type))return;
    var r=roleOf(c),key=r+"|"+c.role_name;
    if(key===last)return; last=key;
    document.body.setAttribute("data-role",r);
    document.getElementById("role-plate-name").textContent=c.role_name||TEXT[r][1];
    document.getElementById("role-plate-hint").textContent=TEXT[r][0];
    document.getElementById("role-plate").style.display="block";
  }

  /* يزيل الستايلات المكتوبة داخل app.js من كل زر وحاوية زر، ويعطيها شكل الموقع الموحد */
  function restyle(root){
    root.querySelectorAll("button,"+IDS.map(function(i){return"#"+i}).join(",")).forEach(function(el){
      if(el.hasAttribute("style"))el.removeAttribute("style");
      if(el.tagName==="BUTTON"&&!el.classList.contains("ct-btn"))el.classList.add("ct-btn");
    });
  }
  function gather(){
    var tray=document.getElementById("role-tray"); if(!tray)return;
    IDS.forEach(function(id){var el=document.getElementById(id); if(el&&el.parentNode!==tray)tray.appendChild(el);});
    restyle(tray);
    var jp=document.getElementById("judge-control-panel");
    var judgeOn=jp&&jp.style.display==="flex"&&jp.children.length;
    tray.classList.toggle("has-items",!!(tray.children.length>1||judgeOn));
  }
  function tick(){
    if(queued)return; queued=true;
    requestAnimationFrame(function(){queued=false;paint();gather();});
  }

  document.addEventListener("DOMContentLoaded",function(){
    new MutationObserver(tick).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style"]});
    setInterval(tick,600);
    ["custom-alert-modal","host-exit-modal"].forEach(function(id){
      var m=document.getElementById(id);
      new MutationObserver(function(){
        if(m.style.display==="flex"||m.style.display==="block")m.classList.add("modal-overlay-active");
      }).observe(m,{attributes:true,attributeFilter:["style"]});
    });
    document.getElementById("btn-modal-close").addEventListener("click",function(){
      var m=document.getElementById("custom-alert-modal");
      m.classList.remove("modal-overlay-active"); m.style.display="";
    });
  });
})();
</script>
</body>
</html>
