<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>محكمة الأدوار - شاشة الترحيب</title>
        <meta name="description" content="محكمة الأدوار - لعبة التحقيق والاستراتيجية الذهنية" />
        <meta property="og:title" content="محكمة الأدوار" />
        <meta property="og:description" content="محكمة الأدوار - لعبة التحقيق والاستراتيجية الذهنية" />

        <!-- استدعاء المكون المباشر لـ Lottie ليعمل فقط أثناء فترة التحميل -->
        <script src="https://lottie.host/5c8b4548-c18c-407f-9e64-00014c2aa006/UAYSrmYfhz.lottie"></script>
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="المحكمة" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="body1">
        <!-- فيديو الخلفية السينمائي الطولي بعد تأمينه وحجب البوستر الافتراضي -->
        <div class="video-background-container">
            <video
                autoplay
                loop
                muted
                playsinline
                preload="auto"
                poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                id="bg-cinema-video">
                <source src="img/vid.mp4" type="video/mp4" />
            </video>
            <div class="video-overlay"></div>
        </div>

        <style>
            .speech-toggle-btn {
                all: unset;
                box-sizing: border-box;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 7px 18px;
                border-radius: 20px;
                background: rgba(13, 25, 43, 0.75);
                border: 1.5px solid var(--gold-glow, #d5a75c);
                color: var(--gold-glow, #d5a75c);
                font-family: "Alexandria", sans-serif;
                font-size: 0.8rem;
                font-weight: 700;
                cursor: pointer;
                margin-bottom: 25px;
                transition: all 0.25s ease;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            }
            .speech-toggle-btn:hover {
                background: rgba(213, 167, 92, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(213, 167, 92, 0.35);
            }
            .speech-toggle-btn.is-speaking {
                border-color: #4ade80;
                color: #4ade80;
                box-shadow: 0 0 16px rgba(74, 222, 128, 0.45);
            }
        </style>

        <!-- الحاوية الرئيسية للشاشة الأولى -->
        <div class="splash-container">
            <div id="welcome-component" class="fade-active">
                <h1 class="welcome-title">محكمة الأدوار</h1>

                <!-- تركنا النص فارغاً ليتم كتابته برمجياً حرفاً بحرف -->
                <p id="dynamic-subtitle" class="welcome-subtitle"></p>

                <!-- زر تفاعلي للاستماع أو إعادة الاستماع للترحيب الصوتي عبر Web Speech API -->
                <button
                    type="button"
                    id="btn-replay-speech"
                    class="speech-toggle-btn"
                    aria-label="استمع للترحيب الصوتي">
                    <span id="speech-icon">🔊</span>
                    <span id="speech-text">استمع للترحيب</span>
                </button>

                <!-- الزر مخفي افتراضياً بانتهاء النص وسيهبط سينمائياً -->
                <a id="btn-start-game-index" class="btn-main btn-hidden" href="rooms.html">ابدأ اللعبة</a>
            </div>
        </div>

        <!-- استدعاء ملف الجافا سكريبت الموحد -->
        <script type="module" src="js/app.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const textPart1 = "مرحباً بك في محكمة الأدوار";
                const textPart2 = "حيث عالم التحقيق والاستراتيجية الذهنية";
                const subtitleElement = document.getElementById("dynamic-subtitle");
                const startButton = document.getElementById("btn-start-game-index");
                const replayButton = document.getElementById("btn-replay-speech");

                // 🎵 صوت هبوط وارتطام الزر
                const sfxButtonDrop = new Audio("img/uh (1).mp3");
                sfxButtonDrop.volume = 0.8;

                let currentText = "";
                let charIndex = 0;
                const typingSpeed = 65;
                let isSpeechActive = false;

                // ==============================================================
                // 🎙️ الصوت البشري الرجالي العصبي (HamedNeural - الأقرب للبشر)
                // ==============================================================
                const humanAudio = new Audio();
                humanAudio.preload = "auto";

                let arabicVoice = null;
                function loadArabicVoices() {
                    if (!("speechSynthesis" in window)) return;
                    const voices = window.speechSynthesis.getVoices() || [];
                    const arVoices = voices.filter((v) => /^ar/i.test(v.lang));
                    arabicVoice =
                        arVoices.find((v) => /natural|neural|google|siri|maged|tariq|naayf/i.test(v.name)) ||
                        arVoices[0] ||
                        null;
                }

                if ("speechSynthesis" in window) {
                    loadArabicVoices();
                    if (window.speechSynthesis.onvoiceschanged !== undefined) {
                        window.speechSynthesis.onvoiceschanged = loadArabicVoices;
                    }
                }

                // دالة نطق النصوص بصوت بشري رجالي طبيعي وعصبي فخم
                function speakPhraseWithHumanVoice(textToSpeak, onEndCallback) {
                    humanAudio.pause();
                    humanAudio.currentTime = 0;
                    humanAudio.src = `/api/speak?text=${encodeURIComponent(textToSpeak)}&voice=ar-SA-HamedNeural`;
                    humanAudio.playbackRate = 0.95;

                    updateSpeechUi(true);

                    let finished = false;
                    const complete = () => {
                        if (finished) return;
                        finished = true;
                        updateSpeechUi(false);
                        if (onEndCallback) onEndCallback();
                    };

                    humanAudio.onended = complete;
                    humanAudio.onerror = () => {
                        // في حال تعذر تشغيل الصوت، التراجع إلى Web Speech API
                        speakPhraseWithWebSpeech(textToSpeak, complete);
                    };

                    const playPromise = humanAudio.play();
                    if (playPromise && playPromise.catch) {
                        playPromise.catch((err) => {
                            console.warn("Autoplay notice, falling back to speech synthesis:", err);
                            speakPhraseWithWebSpeech(textToSpeak, complete);
                        });
                    }
                }

                // بديل Web Speech API في حال كان الجهاز أوفلاين
                function speakPhraseWithWebSpeech(textToSpeak, onEndCallback) {
                    if (!("speechSynthesis" in window)) {
                        if (onEndCallback) onEndCallback();
                        return;
                    }

                    try {
                        if (window.speechSynthesis.paused) {
                            window.speechSynthesis.resume();
                        }
                        window.speechSynthesis.cancel();

                        const utterance = new SpeechSynthesisUtterance(textToSpeak);
                        utterance.lang = "ar-SA";
                        utterance.rate = 0.9;
                        utterance.pitch = 0.95;

                        if (arabicVoice) {
                            utterance.voice = arabicVoice;
                        }

                        let finished = false;
                        const complete = () => {
                            if (finished) return;
                            finished = true;
                            updateSpeechUi(false);
                            if (onEndCallback) onEndCallback();
                        };

                        utterance.onstart = () => {
                            updateSpeechUi(true);
                        };

                        utterance.onend = complete;
                        utterance.onerror = complete;

                        window._welcomeUtterance = utterance;
                        window.speechSynthesis.speak(utterance);
                    } catch (err) {
                        if (onEndCallback) onEndCallback();
                    }
                }

                function updateSpeechUi(speaking) {
                    if (!replayButton) return;
                    const icon = replayButton.querySelector("#speech-icon");
                    const label = replayButton.querySelector("#speech-text");
                    if (speaking) {
                        replayButton.classList.add("is-speaking");
                        if (icon) icon.textContent = "🔊";
                        if (label) label.textContent = "جارٍ النطق الصوتي...";
                    } else {
                        replayButton.classList.remove("is-speaking");
                        if (icon) icon.textContent = "🔈";
                        if (label) label.textContent = "استمع للترحيب (صوت بشري)";
                    }
                }

                // 1️⃣ بدء كتابة الجزء الأول ونطقه بصوت رجالي بشري وقور
                function typePart1() {
                    if (charIndex === 0) {
                        speakPhraseWithHumanVoice(textPart1);
                    }

                    if (charIndex < textPart1.length) {
                        currentText += textPart1.charAt(charIndex);
                        subtitleElement.textContent = currentText;
                        charIndex++;
                        setTimeout(typePart1, typingSpeed);
                    } else {
                        currentText += ".. ";
                        subtitleElement.textContent = currentText;
                        setTimeout(typePart2Init, 1800);
                    }
                }

                function typePart2Init() {
                    charIndex = 0;
                    typePart2();
                }

                // 2️⃣ بدء كتابة الجزء الثاني ونطقه
                function typePart2() {
                    if (charIndex === 0) {
                        speakPhraseWithHumanVoice(textPart2);
                    }

                    if (charIndex < textPart2.length) {
                        currentText += textPart2.charAt(charIndex);
                        subtitleElement.textContent = currentText;
                        charIndex++;
                        setTimeout(typePart2, typingSpeed);
                    } else {
                        triggerButtonDrop();
                    }
                }

                // دالة إطلاق وهبوط الزر السينمائي
                function triggerButtonDrop() {
                    if (startButton) {
                        startButton.classList.remove("btn-hidden");
                        startButton.classList.add("btn-cinema-drop");
                        sfxButtonDrop.play().catch(() => {});
                    }
                }

                function unlockSpeechOnFirstTouch() {
                    humanAudio
                        .play()
                        .then(() => humanAudio.pause())
                        .catch(() => {});
                    if ("speechSynthesis" in window && window.speechSynthesis.paused) {
                        window.speechSynthesis.resume();
                    }
                }
                document.addEventListener("click", unlockSpeechOnFirstTouch, { once: true });
                document.addEventListener("touchstart", unlockSpeechOnFirstTouch, { once: true });

                // زر إعادة الاستماع اليدوي للترحيب الصوتي
                if (replayButton) {
                    replayButton.addEventListener("click", function (e) {
                        e.stopPropagation();
                        unlockSpeechOnFirstTouch();
                        speakPhraseWithHumanVoice(textPart1, () => {
                            setTimeout(() => {
                                speakPhraseWithHumanVoice(textPart2);
                            }, 400);
                        });
                    });
                }

                if (subtitleElement) {
                    typePart1();
                }
            });
        </script>
    </body>
</html>
